        <div id="story-container">

    <div class="page active">

        <p>
            Some stories begin with a grand adventure.<br><br>
            Ours began with a single conversation.
        </p>

    </div>

    <div class="page">

        <p>
            Neither of us knew where those first words would lead.<br><br>
            Every laugh became another page.
        </p>

    </div>

        <p>
            Every memory became another chapter.<br><br>
            And little by little...<br><br>
            We built a library filled with us.
        </p>
